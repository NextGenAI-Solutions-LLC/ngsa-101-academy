
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextGenAI SIS Academy</title>
<style>
body{margin:0;background:#09141e;color:white;font-family:Arial,sans-serif;padding:18px}
main{max-width:720px;margin:auto}
h1{color:#55c8e5;font-size:23px}
.card{background:#142a3b;padding:20px;border-radius:14px;min-height:260px}
h2{color:#fff;font-size:23px}
p,li{line-height:1.6}
button{background:#55c8e5;color:#06131b;border:0;border-radius:9px;padding:13px;font-size:16px;font-weight:bold;margin:5px 3px;cursor:pointer}
button:disabled{opacity:.4}
#caption{color:#c4d9e5;margin-top:15px}
#status{color:#9fb7c7;font-size:14px}
</style>
</head>
<body>
<main>
<h1>NextGenAI Solutions Academy</h1>
<p>SIS Supply Chain & Inventory Management</p>
<div class="card">
<p id="status">Scene 1</p>
<h2 id="title"></h2>
<div id="lesson"></div>
<p id="caption">AI Narrator Ready</p>
</div>
<button id="prev">◀ Previous</button>
<button id="play">▶ Play</button>
<button id="next">Next ▶</button>
<p id="result"></p>
</main>

<script>
const scenes=[
{
title:"Mission Briefing",
text:"Welcome to SIS Supply Chain and Inventory Management. Learn how intelligent systems support supply operations while humans retain authority."
},
{
title:"Resource Service Requests",
text:"Operators submit requests for inventory, equipment, and services. The booking engine validates availability, priority, and authorization."
},
{
title:"Multi-Agent Architecture",
text:"The event bus distributes requests. A master orchestrator routes work to the supply domain supervisor, inventory agent, forecasting agent, and approval gateway."
},
{
title:"Inventory Intelligence",
text:"Inventory agents monitor stock levels, detect shortages, recommend replenishment, and prepare service requests for human review."
},
{
title:"Human Approval",
text:"AI recommends an inventory replenishment. Deterministic controls enforce policy. A human approves or rejects execution.",
quiz:true
},
{
title:"Engineering Assessment",
text:"Demonstrate an inventory request, identify the responsible agents, record an approval decision, and document the simulated operational outcome."
}
];

let index=0;
let speaking=false;
const el=id=>document.getElementById(id);

function stopVoice(){
if("speechSynthesis" in window){
speechSynthesis.cancel();
}
speaking=false;
el("play").textContent="▶ Play";
}

function render(){
const s=scenes[index];
el("title").textContent=s.title;
el("status").textContent=
"Scene "+(index+1)+" of "+scenes.length;
el("lesson").textContent=s.text;
el("caption").textContent="AI Narrator Ready";
el("result").textContent="";
el("prev").disabled=index===0;
el("next").disabled=index===scenes.length-1;

if(s.quiz){
const approve=document.createElement("button");
approve.textContent="Approve Request";
approve.onclick=()=>decision("Approved");
const reject=document.createElement("button");
reject.textContent="Reject Request";
reject.onclick=()=>decision("Rejected");
el("lesson").append(approve,reject);
}
}

function decision(choice){
el("result").textContent=
"Simulation: Request "+choice+
". Decision recorded locally for this exercise.";
}

function changeScene(direction){
stopVoice();
index=Math.max(0,Math.min(scenes.length-1,index+direction));
render();
}

function playVoice(){
if(speaking){
stopVoice();
return;
}
const s=scenes[index];
el("caption").textContent=s.text;

if(!("speechSynthesis" in window)){
el("result").textContent=
"Speech unavailable. Read the captions.";
return;
}

stopVoice();
const voice=new SpeechSynthesisUtterance(
s.title+". "+s.text
);
voice.rate=0.9;
voice.onend=()=>{
speaking=false;
el("play").textContent="▶ Play";
};
voice.onerror=()=>{
speaking=false;
el("play").textContent="▶ Play";
el("result").textContent=
"Narration unavailable on this device.";
};
speaking=true;
el("play").textContent="■ Stop";
speechSynthesis.speak(voice);
}

el("prev").onclick=()=>changeScene(-1);
el("next").onclick=()=>changeScene(1);
el("play").onclick=playVoice;

render();
</script>
</body>
</html>
